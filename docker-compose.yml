
# Local development infrastructure.
#
#   docker compose up -d          start Postgres+PostGIS, Redis and MinIO
#   npm run db:migrate            create the schema
#   npm run db:seed               load demo data
#   npm run start:api             run the API
#
# Nothing here is production-ready: credentials are fixed and ports are bound
# to localhost only.

services:
  postgres:
    # PostGIS is required — the discovery queries use geography(Point,4326)
    # with a GIST index.
    image: postgis/postgis:16-3.4
    container_name: institutes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: institutes
      POSTGRES_PASSWORD: institutes
      POSTGRES_DB: institutes
      # Faster startup for a throwaway dev database.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "127.0.0.1:5433:5433"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d institutes"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: institutes-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # S3-compatible object storage, stands in for ArvanCloud locally.
    image: minio/minio:latest
    container_name: institutes-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Creates the bucket the API expects, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done;
      mc mb --ignore-existing local/institutes;
      mc anonymous set download local/institutes;
      echo 'bucket ready';
      "

volumes:
  postgres-data:
  redis-data:
  minio-data:
